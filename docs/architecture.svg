<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="660" viewBox="0 0 1360 660" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <!-- Source of docs/architecture.png; how to re-render is in the root README (Architecture). -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .t { font-size: 15px; font-weight: 600; fill: #0f172a; }
      .s { font-size: 12px; fill: #475569; }
      .k { font-size: 11px; font-weight: 600; letter-spacing: .08em; fill: #64748b; }
      .l { font-size: 11.5px; fill: #334155; }
      .ld { font-size: 11.5px; fill: #64748b; }
      .e { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#a); }
      .ed { stroke: #94a3b8; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; marker-end: url(#ad); }
      .lb { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1360" height="660" fill="#ffffff"/>

  <!-- ===== Clients ===== -->
  <text x="40" y="128" class="k">CLIENTS</text>
  <g>
    <rect x="40" y="150" width="190" height="70" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="135" y="180" text-anchor="middle" class="t">Browser / PWA</text>
    <text x="135" y="200" text-anchor="middle" class="s">team members</text>

    <rect x="40" y="300" width="190" height="70" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="135" y="330" text-anchor="middle" class="t">Customers</text>
    <text x="135" y="350" text-anchor="middle" class="s">public feedback board</text>

    <rect x="40" y="450" width="190" height="70" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="135" y="480" text-anchor="middle" class="t">AI assistants</text>
    <text x="135" y="500" text-anchor="middle" class="s">Claude, Cursor… over MCP</text>
  </g>

  <!-- ===== kairso image ===== -->
  <rect x="270" y="90" width="750" height="540" rx="18" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="294" y="120" class="k" fill="#4f46e5">KAIRSO IMAGE · ALL-IN-ONE</text>

  <!-- nginx -->
  <rect x="300" y="300" width="110" height="70" rx="12" fill="#ffffff" stroke="#818cf8"/>
  <text x="355" y="330" text-anchor="middle" class="t">nginx</text>
  <text x="355" y="350" text-anchor="middle" class="s">:80</text>

  <!-- Next.js -->
  <rect x="450" y="165" width="170" height="110" rx="12" fill="#ffffff" stroke="#818cf8"/>
  <text x="535" y="196" text-anchor="middle" class="t">Next.js web</text>
  <text x="535" y="216" text-anchor="middle" class="s">:3000 · pages</text>
  <text x="535" y="236" text-anchor="middle" class="s">/api/proxy</text>
  <text x="535" y="254" text-anchor="middle" class="s">/api/mcp · /api/oauth</text>

  <!-- Go API -->
  <rect x="690" y="140" width="300" height="470" rx="14" fill="#ffffff" stroke="#818cf8"/>
  <text x="710" y="166" class="t">Go API server <tspan class="s">:8080</tspan></text>

  <rect x="710" y="180" width="230" height="80" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="825" y="210" text-anchor="middle" class="t">REST · MCP · OAuth</text>
  <text x="825" y="230" text-anchor="middle" class="s">/api · /public · /mcp</text>
  <text x="825" y="246" text-anchor="middle" class="s">permissions, business logic</text>

  <rect x="710" y="282" width="230" height="80" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="825" y="316" text-anchor="middle" class="t">PDF / Excel export</text>
  <text x="825" y="336" text-anchor="middle" class="s">quotes, minutes, KPI</text>

  <rect x="710" y="384" width="230" height="80" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="825" y="418" text-anchor="middle" class="t">Realtime hub</text>
  <text x="825" y="438" text-anchor="middle" class="s">WebSocket /ws</text>

  <rect x="710" y="486" width="230" height="80" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="825" y="520" text-anchor="middle" class="t">Background jobs</text>
  <text x="825" y="540" text-anchor="middle" class="s">reminders · webhook dispatcher</text>

  <!-- ===== External services ===== -->
  <text x="1110" y="128" class="k">DATA &amp; SERVICES</text>
  <!-- cylinders -->
  <g fill="#f0fdf4" stroke="#86efac">
    <path d="M1110,160 a95,10 0 0,0 190,0 a95,10 0 0,0 -190,0 V210 a95,10 0 0,0 190,0 V160"/>
    <path d="M1110,260 a95,10 0 0,0 190,0 a95,10 0 0,0 -190,0 V310 a95,10 0 0,0 190,0 V260"/>
  </g>
  <text x="1205" y="192" text-anchor="middle" class="t">PostgreSQL</text>
  <text x="1205" y="210" text-anchor="middle" class="s">all app data</text>
  <text x="1205" y="292" text-anchor="middle" class="t">MinIO / S3</text>
  <text x="1205" y="310" text-anchor="middle" class="s">files &amp; images</text>

  <rect x="1110" y="350" width="190" height="70" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="1205" y="380" text-anchor="middle" class="t">Firebase</text>
  <text x="1205" y="400" text-anchor="middle" class="s">Auth · Cloud Messaging</text>

  <rect x="1110" y="450" width="190" height="70" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="1205" y="480" text-anchor="middle" class="t">Webhook endpoints</text>
  <text x="1205" y="500" text-anchor="middle" class="s">Slack, n8n, your apps</text>

  <path d="M1110,560 a95,10 0 0,0 190,0 a95,10 0 0,0 -190,0 V610 a95,10 0 0,0 190,0 V560" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="1205" y="592" text-anchor="middle" class="t" fill="#64748b">Redis</text>
  <text x="1205" y="610" text-anchor="middle" class="s">reserved, not used yet</text>

  <!-- ===== Edges ===== -->
  <!-- clients -> nginx -->
  <path class="e" d="M230,185 H252 V322 H298"/>
  <path class="e" d="M230,335 H298"/>
  <path class="e" d="M230,485 H252 V348 H298"/>

  <!-- nginx -> Next.js -->
  <path class="e" d="M355,300 V220 H448"/>
  <rect x="364" y="202" width="86" height="14" rx="3" fill="#eef2ff"/>
  <text x="368" y="213" class="l">everything else</text>

  <!-- nginx -> realtime hub -->
  <path class="e" d="M355,370 V424 H708"/>
  <rect x="446" y="414" width="96" height="16" rx="3" fill="#eef2ff"/>
  <text x="450" y="427" class="l">/ws · WebSocket</text>

  <!-- Next.js -> REST -->
  <path class="e" d="M620,220 H708"/>
  <text x="656" y="194" text-anchor="middle" class="l">HMAC-</text>
  <text x="656" y="209" text-anchor="middle" class="l">signed</text>

  <!-- events bus: REST -> hub, jobs -->
  <path stroke="#475569" stroke-width="1.6" fill="none" d="M940,220 H962 V526"/>
  <path class="e" d="M962,424 H942"/>
  <path class="e" d="M962,526 H942"/>
  <text x="970" y="372" class="l" transform="rotate(90 970 372)">events</text>

  <!-- API -> services -->
  <path class="e" d="M990,185 H1108"/>
  <text x="1049" y="178" text-anchor="middle" class="l">SQL</text>
  <path class="e" d="M990,285 H1108"/>
  <text x="1049" y="278" text-anchor="middle" class="l">presign</text>
  <path class="e" d="M990,385 H1108"/>
  <text x="1049" y="378" text-anchor="middle" class="l">verify · push</text>
  <path class="e" d="M990,485 H1108"/>
  <text x="1049" y="478" text-anchor="middle" class="l">signed POST</text>

  <!-- browser direct: files and sign-in -->
  <path class="ed" d="M135,150 V56 H1330 V385 H1302"/>
  <path class="ed" d="M1330,285 H1302"/>
  <rect class="lb" x="520" y="46" width="360" height="18" rx="3"/>
  <text x="700" y="60" text-anchor="middle" class="ld">browser direct: upload / download by presigned URL · sign in</text>
</svg>
