# Kairso self-host — the app itself: one all-in-one container (web + API + realtime),
# migrations run automatically on start. PostgreSQL/Redis/MinIO come from
# docker-compose.bundled.yml (default) or from your own services set in .env.
#
#   Bundled (default):     COMPOSE_FILE=docker-compose.yml:docker-compose.bundled.yml
#   Your own Postgres/S3:  COMPOSE_FILE=docker-compose.yml, then set DB_* / MINIO_* in .env
name: kairso

services:
  kairso:
    image: ${KAIRSO_IMAGE:-alexcao194/kairso}:${KAIRSO_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-8080}:80"
    env_file: .env
    volumes:
      - ./data/kairso:/data                                   # generated secrets
      - ./firebase-credentials.json:/etc/kairso/firebase-credentials.json:ro
